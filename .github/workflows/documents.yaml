name: Documentation
on:
  push:
    branches:
      - 'main'
jobs:
  deploy:
    name: 'Deploy Redirect'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      # opteryx.dev is retired; this publishes a redirect-only site to
      # gh-pages so the domain forwards visitors to https://opteryx.app
      - name: Publish redirect site to gh-pages
        run: |
          set -euo pipefail
          rm -rf /tmp/gh-pages-deploy
          mkdir -p /tmp/gh-pages-deploy
          cp redirect/index.html /tmp/gh-pages-deploy/index.html
          cp redirect/404.html /tmp/gh-pages-deploy/404.html
          cp redirect/robots.txt /tmp/gh-pages-deploy/robots.txt
          printf 'opteryx.dev\nwww.opteryx.dev\n' > /tmp/gh-pages-deploy/CNAME
          touch /tmp/gh-pages-deploy/.nojekyll

          cd /tmp/gh-pages-deploy
          git init -q
          git checkout -q -b gh-pages
          git config user.name XB500
          git config user.email XB500@users.noreply.github.com
          git add -A
          git commit -q -m "Redirect opteryx.dev to opteryx.app"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
